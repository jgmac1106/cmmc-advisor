id: modern-it-ai-dev-tools
title: Evaluating AI coding assistants for CUI development work
category: modern-it

prompt: |
  Our developers want to use AI coding assistants on the CUI-
  containing code for our DoD subcontract. They are asking for
  Cursor, Claude Code, or GitHub Copilot. We run Microsoft 365
  GCC High for productivity. What are the compliant options, and
  what do we need to configure for each?

required_terms:
  - Bedrock GovCloud
  - Cursor
  - Claude Code
  - GitHub Copilot
  - workspace context

factual_claims_expected: true

expected_recommendation: |
  Map repository content, workspace context, prompts, completions, logs,
  telemetry, and each model provider through the actual configured path.
  Do not authorize any named tool solely because its model backend has an
  authorization. Check the exact service, region, model, and authorization
  boundary, as well as the subcontract's requirements. For Claude Code on
  Bedrock GovCloud, verify the current AWS model matrix and telemetry and
  routing controls. For GitHub Copilot, check GitHub's current US data
  residency and FedRAMP-model restriction policy, including that it is
  disabled by default; do not claim a fixed Azure OpenAI Government backend
  or that CUI source code is automatically covered. For Cursor, check its
  current vendor data-flow documentation before classifying it. Withhold CUI
  from any tool until the full workflow is supported by current primary
  evidence and the contract; propose a controlled approved path or a
  local alternative in the meantime.

evaluator_notes: |
  Reward verification of both developer-tool and model paths, region/model
  checks, and current primary-source dates. Penalize unsupported April 2026
  product assertions and blanket approval of CUI source code. Give a
  practical path to evaluate or use a controlled alternative.
