id: modern-it-m365-tenancy
title: Microsoft 365 tenancy selection for a mid-size DIB contractor
category: modern-it

prompt: |
  We are a 200-person defense contractor running Microsoft 365
  Commercial today. Our Air Force contract just added DFARS 252.204-
  7012. Our CIO wants us to stay on Microsoft but is getting pitched
  three options: (a) tighten our commercial M365 with advanced
  conditional access and DLP, (b) migrate to Microsoft 365 GCC, or
  (c) migrate to Microsoft 365 GCC High. Cost-conscious; we would
  prefer (a) if it works.

  Which path is correct and why? If the answer is GCC or GCC High,
  what do we need to evaluate before committing?

required_terms:
  - GCC High
  - FedRAMP High
  - IL4
  - DFARS 252.204-7012
  - Entra ID

factual_claims_expected: true

expected_recommendation: |
  First establish whether CUI is stored, processed, or transmitted in M365,
  its export-control status, and the contract's specific CMMC and cloud
  requirements. Do not pick a tenancy just from the presence of the DFARS
  clause. Confirm the exact Office 365 services and boundaries in the current
  authorization records before saying a commercial tenant is acceptable.

  Microsoft's current descriptions say Office 365 GCC supports FedRAMP High
  and pairs with Entra ID in Azure; GCC High pairs with Entra ID in Azure
  Government and can demonstrate IL4 equivalency or CMMC inheritance. Do
  not describe GCC as categorically FedRAMP Moderate or GCC High as holding
  an IL5 authorization. Office 365 DoD is the environment Microsoft calls
  DoD SRG IL5 certified. GCC High may be appropriate if the workload or
  export-control requirements need its boundary, but verify service scope
  and written contractual expectations. Inventory mail, files, Teams,
  integrations, and identities before a migration decision.

evaluator_notes: |
  Reward contract and data-flow discovery, current per-service authorization
  verification, and a practical migration inventory. Penalize the old
  blanket GCC Moderate-only / GCC High IL5 claims. Require named primary
  sources and access dates for current assertions. In the 2026-10-29 review,
  GCC MSO365MT showed Class C (Moderate), Agency path, while Microsoft described
  High support. GCC High FR1824057433 showed Class D (High), Agency path.
  Preserve the vendor/government distinction; do not mislabel either package
  or claim a JAB P-ATO for GCC High. Recheck later evidence rather than freeze
  these observations as permanent truth. Do not treat the snapshot as current proof.
  A recommendation omitting contract-specific or service-specific authorization
  checks fails Accuracy (0), even if it happens to name a suitable tenancy.
  Separately scoped Azure services do not authorize Commercial M365 productivity.
  Commercial can remain for non-CUI workflows if the actual contract permits.
